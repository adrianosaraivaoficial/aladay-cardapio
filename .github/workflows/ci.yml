name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: aladay_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d aladay_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/aladay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run db:preflight
        env:
          MIGRATION_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: npm run db:migrate -- --confirm-database=aladay_test
        env:
          MIGRATION_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker build -t aladay:ci .

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/audit/seguranca-estabilidade-20261117')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Record immutable digest
        run: echo "ghcr.io/${GITHUB_REPOSITORY}@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
